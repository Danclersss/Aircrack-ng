services:
  - type: web
    name: futbr-arena
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.cjs
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
