function renderPitch(){const m=state.match;m.ball=m.ball||{x:50,y:50};const homeDots=[[9,50],[22,23],[22,42],[22,58],[22,77],[37,24],[37,50],[37,76],[58,30],[58,50],[58,70]];const awayDots=homeDots.map(([x,y])=>[100-x,y]);const dots=[...homeDots.map(([x,y])=>`<span class="pitch-dot home-dot" style="left:${x}%;top:${y}%"></span>`),...awayDots.map(([x,y])=>`<span class="pitch-dot away-dot" style="left:${x}%;top:${y}%"></span>`)].join('');const last=m.events[m.events.length-1];return `<div class="pitch" id="match-pitch"><div class="pitch-circle"></div><div class="box-left"></div><div class="box-right"></div><div class="pitch-six-left"></div><div class="pitch-six-right"></div>${dots}<span id="match-ball" class="pitch-ball" style="left:${m.ball.x}%;top:${m.ball.y}%">⚽</span><div class="pitch-label">FUTBR · CAMPO TÁTICO 2D</div><div class="pitch-event" id="pitch-event">${esc(last?.text||'A bola ainda não rolou')}</div></div>`}
function advanceBall(){if(!state?.match)return;const m=state.match,ug=currentUserGame();m.ball=m.ball||{x:50,y:50};let x=m.ball.x,y=m.ball.y;const fresh=ug?.events?.filter(e=>e.minute===m.minute)||[];if(fresh.some(e=>e.type==='goal')){const goal=fresh.find(e=>e.type==='goal');const userAttacking=goal.teamId===state.clubId;const userHome=ug.homeId===state.clubId;x=(userAttacking===userHome)?94:6;y=rnd(24,76);const pitch=$('#match-pitch');if(pitch){pitch.classList.remove('goal-flash');void pitch.offsetWidth;pitch.classList.add('goal-flash')}}else if(fresh.length){const event=fresh[fresh.length-1];x=event.teamId===state.clubId?clamp(x+rnd(4,18),10,90):clamp(x-rnd(4,18),10,90);y=clamp(y+rnd(-18,18),12,88)}else{x=clamp(x+rnd(-11,11),8,92);y=clamp(y+rnd(-16,16),12,88)}m.ball={x,y};}

function renderMarketRows(){if(!state)return '';const pos=$('#market-filter')?.value||'all',sort=$('#market-sort')?.value||'ovr';let list=state.market.filter(p=>pos==='all'||p.position===pos);if(sort==='cheap')list.sort((a,b)=>a.value-b.value);else if(sort==='young')list.sort((a,b)=>a.age-b.age);else list.sort((a,b)=>b.overall-a.overall);const c=getUserClub();return list.map(p=>{const disabled=c.roster.length>=30||c.budget<p.value||getPayroll(c)+p.wage>c.wageCap;return `<div class="list-card"><div class="player-info"><div class="player-avatar">${p.position}</div><div><div class="player-name">${esc(p.name)} <span class="pill">${p.position}</span></div><div class="player-meta">${esc(POSITION_NAMES[p.position])} · ${p.age} anos · ${p.energy}% energia · Salário ${money(p.wage)}/jogo</div><div class="bar-stat"><span style="width:${p.overall}%"></span></div></div></div><div class="player-right"><div style="text-align:right"><div style="font-size:11px;font-weight:900">${money(p.value)}</div><div class="player-meta">Valor estimado</div></div><div class="ovr">${p.overall}</div><button class="btn btn-primary" data-action="buy-player" data-id="${p.id}" ${disabled?'disabled':''}>Contratar</button></div></div>`}).join('')||'<div class="empty-log">Nenhum atleta encontrado com esse filtro.</div>'}
function buyPlayer(id){const c=getUserClub(),p=state.market.find(x=>x.id===id);if(!p)return toast('Atleta indisponível ou já contratado.');if(c.roster.some(x=>x.id===id))return toast('Este jogador já pertence ao seu elenco.');if(c.roster.length>=30)return toast('Limite de 30 atletas atingido.');if(c.budget<p.value)return toast('Saldo insuficiente para essa contratação.');if(getPayroll(c)+p.wage>c.wageCap)return toast('A folha salarial ultrapassaria o teto do clube.');c.budget-=p.value;c.roster.push({...p,market:false});state.market=state.market.filter(x=>x.id!==id);saveSlots();render();toast(`${p.name} contratado por ${money(p.value)}.`)}
function sellPlayer(id){const c=getUserClub(),p=c.roster.find(x=>x.id===id);if(!p)return;if(c.lineup.includes(id)){if(c.lineup.length<=11)return toast('Escalone um substituto antes de vender.');c.lineup=c.lineup.filter(x=>x!==id);const replacement=c.roster.find(x=>!c.lineup.includes(x.id)&&posGroup(x.position)===posGroup(p.position));if(replacement)c.lineup.push(replacement.id)}const fee=Math.round(p.value*.72);c.budget+=fee;c.roster=c.roster.filter(x=>x.id!==id);if(c.keeperId===id)c.keeperId=null;state.market.push({...p,market:true,value:Math.round(p.value*.9)});saveSlots();render();toast(`${p.name} vendido por ${money(fee)}.`)}
function renderTable(){const table=sortedTable(),user=getUserClub();return `<div class="tab-page"><div class="grid stats"><div class="card stat"><div class="stat-label">Líder</div><div class="stat-value" style="font-size:20px">${esc(table[0]?.short||'—')}</div><div class="stat-foot">${table[0]?.table.pts||0} pontos</div></div><div class="card stat"><div class="stat-label">Sua posição</div><div class="stat-value">${table.findIndex(t=>t.id===user.id)+1}º</div><div class="stat-foot">${user.table.pts} pontos</div></div><div class="card stat"><div class="stat-label">Rodadas concluídas</div><div class="stat-value">${user.table.p}</div><div class="stat-foot">De ${state.fixtures.length} rodadas nesta fase</div></div><div class="card stat"><div class="stat-label">Saldo de gols</div><div class="stat-value">${user.table.gf-user.table.ga>0?'+':''}${user.table.gf-user.table.ga}</div><div class="stat-foot">${user.table.gf} pró · ${user.table.ga} contra</div></div></div><section class="card"><div class="card-head"><div><div class="kicker">${esc(state.league)} · temporada ${state.season}</div><h2>Classificação completa</h2><div class="subheading">Desempates: pontos, vitórias, saldo de gols e gols marcados.</div></div><span class="tag">${state.leagueKey==='D'?`Grupo ${getUserClub().group} · ${sortedTable().length} clubes`:`${state.clubs.length} clubes`}</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Clube</th><th>PTS</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>Força</th></tr></thead><tbody>${table.map((t,i)=>`<tr class="${t.id===user.id?'row-user':''}"><td class="rank">${i+1}</td><td><div class="team-cell"><span class="tiny-crest">${esc(t.short)}</span>${esc(t.name)}${t.id===user.id?' <span class="tag">VOCÊ</span>':''}</div></td><td><strong>${t.table.pts}</strong></td><td>${t.table.p}</td><td>${t.table.w}</td><td>${t.table.d}</td><td>${t.table.l}</td><td>${t.table.gf}</td><td>${t.table.ga}</td><td class="${t.table.gf-t.table.ga>=0?'positive':'negative'}">${t.table.gf-t.table.ga>0?'+':''}${t.table.gf-t.table.ga}</td><td>${Math.round(clubStrength(t))}</td></tr>`).join('')}</tbody></table></div><div class="field-help" style="margin-top:12px">Classificação atualizada apenas ao fim dos 90 minutos. As partidas de uma rodada são simuladas no mesmo relógio.</div></section></div>`}
function renderFinance(){const c=getUserClub(),pay=getPayroll(c),cap=Math.min(c.stadiumCap,110000),forecast=calcAttendance(c,{power:72}),ratio=cap?forecast/cap:0,defaultCost=Math.round(Math.min(1000,110000-cap)*(3200+Math.max(0,cap-30000)*.012));return `<div class="tab-page"><div class="grid stats"><div class="card stat"><div class="stat-label">Caixa disponível</div><div class="stat-value" style="font-size:22px">${money(c.budget)}</div><div class="stat-foot">Movimenta com bilheteria e custos</div></div><div class="card stat"><div class="stat-label">Folha salarial</div><div class="stat-value" style="font-size:22px">${money(pay)}</div><div class="stat-foot">Custo por rodada aprox. ${money(pay*.25)}</div></div><div class="card stat"><div class="stat-label">Capacidade</div><div class="stat-value">${num(cap)}</div><div class="stat-foot">Limite máximo: 110.000</div></div><div class="card stat"><div class="stat-label">Público estimado</div><div class="stat-value">${num(forecast)}</div><div class="stat-foot">${Math.round(ratio*100)}% da capacidade</div></div></div><div class="grid two-col"><section class="card"><div class="card-head"><div><div class="kicker">Bilheteria</div><h2>Preço dos ingressos</h2><div class="subheading">Ajuste a demanda antes dos próximos jogos em casa.</div></div><span class="tag goldtag">Elasticidade ativa</span></div><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="muted small">Preço por ingresso</div><div id="ticket-price-value" class="stat-value">${money(c.ticketPrice)}</div></div><span class="tag ticket-forecast">Renda projetada: ${money(forecast*c.ticketPrice)}</span></div><input class="range" type="range" id="ticket-price" min="10" max="300" step="5" value="${c.ticketPrice}"><div class="toolbar" style="margin:10px 0 18px"><span class="small muted">Popular · R$ 10</span><span class="small muted">Premium · R$ 300</span></div><div class="bar-row"><span>Demanda</span><div class="bar-track"><span style="width:${Math.round(ratio*100)}%"></span></div><strong>${Math.round(ratio*100)}%</strong></div><div class="alert">Preços baixos aumentam a ocupação; preços altos reduzem a procura. A lotação considera popularidade e força do adversário.</div><button class="btn btn-primary" data-action="save-ticket" style="margin-top:15px">Aplicar preço para próximos jogos</button></section><section class="card"><div class="card-head"><div><div class="kicker">Infraestrutura</div><h2>${esc(c.stadiumName||'Estádio principal')}</h2><div class="subheading">${esc(c.stadiumOwner||'Gestão local')}</div><div class="subheading">Amplie a capacidade, sem crescimento infinito.</div></div><span class="tag">${num(cap)} lugares</span></div><div class="field"><label for="stadium-add">Novos assentos</label><select id="stadium-add"><option value="1000">+1.000 lugares</option><option value="5000">+5.000 lugares</option><option value="10000">+10.000 lugares</option><option value="25000">+25.000 lugares</option></select><div class="field-help">Custo-base: R$ 3.200 por assento; valor progressivo conforme capacidade.</div></div><div class="list-card"><div><div class="player-name">Custo estimado</div><div class="player-meta">Calculado conforme a expansão selecionada</div></div><strong id="stadium-cost">${money(defaultCost)}</strong></div><button class="btn btn-primary" data-action="expand-stadium" style="width:100%;margin-top:10px" ${cap>=110000?'disabled':''}>Construir expansão</button><div class="header-divider"></div><div class="section-title"><div><h2>Controle financeiro</h2><p>Movimentações mais recentes.</p></div></div><div class="list-card"><div><div class="player-name">Orçamento inicial da temporada</div><div class="player-meta">Capital inicial simulado</div></div><strong>${money(c.initialBudget)}</strong></div><div class="list-card"><div><div class="player-name">Última bilheteria</div><div class="player-meta">${state.lastSummary?.round===state.round?`Rodada ${state.round}`:'Sem partida recente em casa nesta rodada'}</div></div><strong>${money(c.lastGate||0)}</strong></div><div class="list-card"><div><div class="player-name">Último público</div><div class="player-meta">Ingresso a ${money(c.ticketPrice)}</div></div><strong>${num(c.lastAttendance||0)}</strong></div></section></div></div>`}
function updateStadiumCost(){const c=getUserClub(),sel=$('#stadium-add');if(!sel)return;const add=Number(sel.value),current=c.stadiumCap,cost=Math.round(add*(3200+Math.max(0,current-30000)*.012));$('#stadium-cost').textContent=money(cost)}
function expandStadium(){const c=getUserClub(),add=Number($('#stadium-add')?.value||1000),realAdd=Math.min(add,110000-c.stadiumCap),cost=Math.round(realAdd*(3200+Math.max(0,c.stadiumCap-30000)*.012));if(realAdd<=0)return toast('O estádio já atingiu 110.000 lugares.');if(c.budget<cost)return toast(`Saldo insuficiente. A obra custa ${money(cost)}.`);c.budget-=cost;c.stadiumCap+=realAdd;saveSlots();render();toast(`Estádio ampliado em ${num(realAdd)} lugares.`)}
function renderCups(){const cup=state.cup;const brazilian=['A','B','C','D'].includes(state.leagueKey);const phaseNames=['Primeira fase','Fase 2','Fase 3','Semifinais','Final','Encerrada'];const userIn=cup.teams.includes(state.clubId)&&!cup.eliminated&&!cup.complete;const progress=cup.history.map(h=>`<div class="list-card"><div><div class="player-name">${esc(h.name)}</div><div class="player-meta">${h.results.length} confrontos simulados</div></div><span class="tag">${esc(h.winnerName||'Concluído')}</span></div>`).join('');const continentalTitle=brazilian?'Libertadores & Sul-Americana':'Champions League, Europa League & Conference';const continentalKicker=brazilian?'América do Sul':'UEFA';const continentalText=brazilian?'A referência da Libertadores 2026 tem 32 clubes, oito grupos e seis jogos por equipe na fase de grupos. O calendário continental não está integrado automaticamente à liga nesta versão.':'Os campeonatos continentais europeus são apresentados como referência, mas sorteios, classificação e calendário UEFA ainda não são simulados junto à liga nacional nesta versão.';const nationalText=brazilian?'A Copa do Brasil real de 2026 tem 126 participantes. Esta chave é compacta e independente do calendário oficial.':'A copa nacional está disponível em formato compacto com os clubes da liga escolhida; não reproduz todas as divisões nem o chaveamento oficial completo.';return `<div class="tab-page"><div class="grid feature-grid"><section class="card feature"><div class="feature-icon">🏆</div><div class="kicker">Competição eliminatória</div><h2>${esc(cup.name||'Copa nacional')}</h2><p>${nationalText}</p><div class="toolbar" style="width:100%"><span class="tag ${cup.complete?'goldtag':cup.eliminated?'redtag':'tag'}">${cup.complete?'Concluída':cup.eliminated?'Eliminado':userIn?'Em andamento':'Não disponível'}</span>${!cup.complete&&!cup.eliminated?`<button class="btn btn-primary" data-action="cup-next">${cup.phase===0?'Iniciar copa':'Simular fase'} →</button>`:''}</div></section><section class="card feature"><div class="feature-icon">🌎</div><div class="kicker">${continentalKicker}</div><h2>${continentalTitle}</h2><p>${continentalText}</p><span class="tag goldtag">Formato de referência · integração futura</span></section><section class="card feature"><div class="feature-icon">🌐</div><div class="kicker">Seleções nacionais</div><h2>Eliminatórias & Copa do Mundo</h2><p>Convocações de seleções, amistosos internacionais e Copa do Mundo ainda não estão conectados ao motor de carreira. O rendimento do treinador pode ser usado numa expansão futura do projeto.</p><span class="tag goldtag">Ainda sem simulação internacional</span></section></div><section class="card"><div class="card-head"><div><div class="kicker">Seu caminho no mata-mata</div><h2>Chave da copa nacional</h2><div class="subheading">${cup.complete?`Campeão: ${esc(cup.champion||'—')}`:cup.eliminated?'Você foi eliminado da competição.':`Fase ${cup.phase+1} · ${cup.teams.length} clubes restantes`}</div></div><span class="tag">${cup.teams.length} clubes restantes</span></div>${cup.history.length?progress:'<div class="empty-log">A copa ainda não começou. Pressione “Iniciar copa” para sortear e simular a primeira fase.</div>'}<div class="header-divider"></div><div class="alert">A copa nacional usa uma chave simplificada independente das partidas da liga. Os resultados e os prêmios são salvos na carreira, mas a estrutura oficial completa ainda não está reproduzida.</div></section></div>`}
function simCupMatch(id1,id2){const a=clubByAny(id1),b=clubByAny(id2);const powerA=a?.power||rnd(58,75),powerB=b?.power||rnd(58,75);const baseA=Math.max(0.2,(powerA+4)/(powerA+powerB+8)),gA=goalSample(baseA),gB=goalSample(1-baseA);let x=gA,y=gB,decision='';if(x===y){const winA=Math.random()<clamp(.5+(powerA-powerB)*.012,.2,.8);decision=' (pênaltis)';if(winA)x++;else y++}return {id1,id2,aName:a?.name||'Clube convidado',bName:b?.name||'Clube convidado',aGoals:gA,bGoals:gB,winner:x>y?id1:id2,decision}}
function goalSample(prob){const lambda=clamp(1.1+prob*1.2,.4,2.9);let l=Math.exp(-lambda),k=0,p=1;do{k++;p*=Math.random()}while(p>l&&k<10);return k-1}
function clubByAny(id){return state.clubs.find(c=>c.id===id)||Object.values(LEAGUES).flatMap(l=>l.clubs).find(c=>c.id===id)}
function nextCupPhase(){const cup=state.cup;if(cup.complete||cup.eliminated)return;let teams=cup.teams.slice();if(!cup.history.length){teams=teams.sort(()=>Math.random()-.5)}if(!teams.includes(state.clubId)){cup.eliminated=true;saveSlots();render();return toast('Seu clube não está mais na chave.')}let results=[],winners=[];for(let i=0;i<teams.length;i+=2){if(!teams[i+1]){winners.push(teams[i]);continue}const r=simCupMatch(teams[i],teams[i+1]);results.push(r);winners.push(r.winner)}const userResult=results.find(r=>r.id1===state.clubId||r.id2===state.clubId);let phaseName=['Fase de 32','Oitavas de final','Quartas de final','Semifinais','Final'][cup.phase]||'Fase';cup.history.push({name:phaseName,results,winnerName:winners.length===1?(clubByAny(winners[0])?.name||winners[0]):''});cup.phase++;cup.teams=winners;cup.eliminated=!winners.includes(state.clubId);if(winners.length===1){cup.complete=true;cup.champion=clubByAny(winners[0])?.name||'Campeão';if(winners[0]===state.clubId){const c=getUserClub();c.budget+=8000000;c.coachRating=clamp(c.coachRating+12,0,100);state.notifications.unshift('Campeão da Copa do Brasil compacta! Prêmio de R$ 8 milhões.')}}else if(cup.eliminated){const c=getUserClub();c.budget+=250000;c.coachRating=clamp(c.coachRating+1,0,100);state.notifications.unshift('Eliminado da Copa do Brasil; o clube recebeu uma premiação de participação.')}saveSlots();render();if(userResult){const userWon=userResult.winner===state.clubId;toast(userWon?`Você avançou! ${userResult.aGoals}–${userResult.bGoals}${userResult.decision}`:`Eliminação na copa: ${userResult.aGoals}–${userResult.bGoals}${userResult.decision}`)}else toast('Fase da copa simulada.')}
function renderHistory(){const c=getUserClub();return `<div class="tab-page"><section class="card"><div class="card-head"><div><div class="kicker">Registro da carreira</div><h2>Histórico de partidas</h2><div class="subheading">${state.history.length} jogos registrados na liga.</div></div><span class="tag">${state.coach}</span></div>${state.history.length?state.history.slice().reverse().map(h=>`<div class="list-card"><div><div class="player-name">Rodada ${h.round} · ${h.home?'casa':'fora'}</div><div class="player-meta">${esc(h.home?'vs. ':'@ ')}${esc(h.opponent)}</div></div><strong>${esc(h.result)}</strong></div>`).join(''):'<div class="empty-log">Seu histórico aparecerá após o primeiro jogo.</div>'}</section><section class="card"><div class="card-head"><div><div class="kicker">Caixa de entrada</div><h2>Notificações do clube</h2></div><button class="btn btn-ghost" data-action="clear-notifications">Limpar</button></div>${state.notifications.length?state.notifications.map(n=>`<div class="list-card"><span class="player-meta">◆ ${esc(n)}</span></div>`).join(''):'<div class="empty-log">Nenhuma notificação.</div>'}</section><section class="card"><div class="card-head"><div><div class="kicker">Gerenciar carreira</div><h2>Backup e slots</h2><div class="subheading">Exporte um arquivo JSON e restaure depois neste navegador.</div></div></div><div class="btn-row"><button class="btn btn-primary" data-action="export-save">Exportar save (.json)</button><label class="btn btn-ghost" for="import-save" style="cursor:pointer">Importar save</label><input id="import-save" type="file" accept="application/json" class="hidden"></div><div class="field-help" style="margin-top:12px">O autosave usa o armazenamento local do navegador. Exporte backups periódicos antes de limpar os dados do navegador ou trocar de computador.</div></section></div>`}

function substitute(outId,inId){const c=getUserClub(),m=state.match;if(!inId)return toast('Escolha um atleta para entrar.');if(!['halftime','paused','pre'].includes(m.status))return toast('Só é possível trocar no intervalo ou com a partida pausada.');const isPre=m.status==='pre';if(!isPre&&m.subsUsed>=5)return toast('Você já usou as cinco substituições permitidas.');if(m.status==='paused'&&m.minute>45&&!m.pauseSubUsed){if(m.subWindowsUsed>=3)return toast('Você já usou as três oportunidades de substituição do 2º tempo.');m.subWindowsUsed++;m.pauseSubUsed=true}const out=c.roster.find(p=>p.id===outId),incoming=c.roster.find(p=>p.id===inId);if(!out||!incoming)return toast('Jogador inválido.');if(!c.lineup.includes(outId))return toast('O jogador selecionado não é titular.');if(c.lineup.includes(inId))return toast('Este jogador já está na escalação.');if(posGroup(out.position)!==posGroup(incoming.position))return toast('Escolha um atleta da mesma linha tática.');c.lineup=c.lineup.map(id=>id===outId?inId:id);if(c.keeperId===outId)c.keeperId=incoming.position==='G'?incoming.id:null;if(out.position==='G'&&c.keeperId===null&&incoming.position==='G')c.keeperId=incoming.id;if(!isPre)m.subsUsed++;m.events.push({minute:m.minute,text:`Substituição: ${incoming.name} entra no lugar de ${out.name}.`,type:'info'});saveSlots();render();toast(isPre?'Escalação pré-jogo atualizada.':`Substituição realizada (${m.subsUsed}/5).`)}

function sanitize(c){const used=new Set();const out=[];
