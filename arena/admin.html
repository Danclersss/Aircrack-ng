<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração · FutBR</title><link rel="stylesheet" href="admin.css"><main><a href="./">← Arena</a><p class="eyebrow">FUTBR / ACESSO RESTRITO</p><h1>Contas e apoio à comunidade</h1><p>Dados mínimos, sessão de dez minutos e segundo fator. Senhas e códigos de recuperação nunca são exibidos.</p><form id="admin-login"><label>Token administrativo<input id="admin-token" type="password" autocomplete="off" minlength="32" required></label><label>Código do autenticador<input id="admin-otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button>Entrar com segundo fator</button></form><p id="admin-status" role="status"></p><div id="admin-workspace" hidden><div class="tools"><input id="account-id" placeholder="Buscar ID exato da conta" aria-label="ID da conta"><button id="account-search">Buscar</button><button id="account-all">Listar contas</button><button id="admin-logout">Sair</button></div><section id="accounts"></section><button id="next-accounts" hidden>Próximas contas</button><section class="reward-editor"><h2>Premiar um relato de bug</h2><p>Confira o ID e o clube. Use uma referência única do relato para impedir entrega duplicada.</p><form id="bug-reward"><label>ID da conta<input name="userId" required></label><label>Referência do relato<input name="reference" minlength="6" maxlength="80" pattern="[A-Za-z0-9_-]+" required></label><label>Mensagem para o jogador<textarea name="reason" minlength="8" maxlength="500" required></textarea></label><div class="columns"><label>FutCoins<input name="coins" type="number" min="0" max="100000" value="0"></label><label>Pacotes do clube<input name="packs" type="number" min="0" max="20" value="0"></label></div><label>Cartas específicas · até dez<select id="reward-cards" name="cards" multiple size="8"></select></label><label class="check"><input name="special" type="checkbox">Incluir o pacote Fundadores preservado</label><button>Revisar premiação</button></form></section></div></main><dialog id="reward-confirm"></dialog><script src="players.js?v=16"></script><script src="admin.js"></script></html>
